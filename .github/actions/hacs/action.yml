# Official hacs/action image, frozen by registry digest on 2026-11-10.
# Inputs reviewed against hacs/action commit 1ebf01c408f29afcb6406bd431bc98fd8cbb15aa.
# Upstream action.yml uses the mutable :main image even at a fixed Git commit.
name: Pinned HACS validation
description: Run the official HACS validator with an immutable image
inputs:
  category:
    description: Repository category
    required: true
  comment:
    description: Post validation comments
    default: 'false'
  github_token:
    description: GitHub token
    default: ${{ github.token }}
runs:
  using: docker
  image: docker://ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2
